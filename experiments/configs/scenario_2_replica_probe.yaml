# ─────────────────────────────────────────────────────────────────────────────
# Scenario 2 replica-scaling probe (Option 2)
#
# Independent of campaign / baseline run counters. Frontend HPA is pinned at
# 6 by hand before the run (min=max=6); this YAML scales checkout to 2 and
# halves CPU reservations so the extra pods fit the 16-vCPU worker.
#
# Hold A (run1): same Locust counts as S2 baseline run28 (300/60/210/50/50).
# Hold B (run2): +40% on the three heavy APIs (420/85/295/50/50).
# Hold C was not run (TopFull stayed at threshold 10000). Next free: run3.
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 2
scenario_name: sustained_overload
condition: baseline
run_number: 3                  # run1 = Hold A (run28 counts); run2 = Hold B (+40%)
description: >
  Replica-scaling probe next-free slot. Last completed: Hold B run2
  (frontend 6 + checkout 2, 420/85/295/50/50, cpu_request_fraction 0.5).

duration_seconds: 600

cpu_request_fraction: 0.5

locust:
  user_counts:
    getproduct:   420
    postcheckout: 85
    getcart:      295
    postcart:     50
    emptycart:    50
  spawn_rate: 50
  scripts:
    - online_boutique_create_v2.sh

scale_constraints:
  - deployment: checkoutservice
    method: replicas
    replicas: 2

retries:
  attempts_on: 3
  attempts_off: 0
  per_try_timeout_ms: 500

topfull_rl:
  enabled: true

retryguard:
  enabled: false
  rejection_threshold: 0.20
  sample_interval_seconds: 1
  interval_samples: 30

envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  transport: network_prometheus
  max_workers: 4

resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

log_folder: probe_replicas_f6c2_sustained_overload_run3

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
