# final_configs copy. Do not edit the source from here.
# Source: experiments/configs/scenario_1_baseline.yaml
# Variant: tf_only.
# Burst mode: the three burst keys are present (burst_rpr, burst_window_seconds, burst_min_first_attempts).
#

# ─────────────────────────────────────────────────────────────────────────────
# Scenario 1 — Normal Operation  |  Condition: BASELINE (no RetryGuard)
#
# Goal: Sanity check. Flat load well within capacity. Nothing should be
# throttled by TopFull and RetryGuard (when on) must make zero VirtualService
# patches. Comparison between baseline and retryguard must be statistically
# identical — any divergence signals a threshold calibration problem.
#
# Run this BEFORE any overload scenarios.
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 1
scenario_name: normal_operation
condition: baseline            # baseline = RetryGuard OFF
run_number: 3
description: >
  Flat RPS well within cluster capacity. TopFull active, retries on (default),
  RetryGuard NOT running. Establishes the healthy-system reference point.

# ── Timing ──────────────────────────────────────────────────────────────────
duration_seconds: 300          # 5 minutes is sufficient for a sanity check

# ── Load ────────────────────────────────────────────────────────────────────
# Locked 2026-10-08 from both-off run8. Same counts on every S1 variant.
locust:
  user_counts:
    getproduct:   175
    postcheckout: 30
    getcart:      70
    postcart:     90
    emptycart:    5
  spawn_rate: 50               # Ron's divisor: Locust -r = count / RATE
  scripts:
    - online_boutique_create_v2.sh

# ── Topology constraints ─────────────────────────────────────────────────────
# Paper-C1 millicores (ADR 0009). Frontend 1150m is the HPA pin,
# not a scale_constraint. Written into this final_configs copy;
# the source YAML still has an empty list.
scale_constraints:
- deployment: checkoutservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 800
- deployment: recommendationservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 1150
- deployment: productcatalogservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 800
- deployment: cartservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 800
- deployment: currencyservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 770
- deployment: shippingservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 770
- deployment: adservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 1150
- deployment: paymentservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 155
- deployment: emailservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 120
- deployment: redis-cart
  namespace: default
  container: redis
  method: cpu_limit
  cpu_limit_millicores: 540

# ── Retry policy (Istio VirtualService — applies both arms) ──────────────────
retries:
  attempts_on: 3            # retries.attempts when ON
  attempts_off: 0           # 0 = bare retries: {attempts: 0} (true zero retries; no retryOn/perTryTimeout)
  per_try_timeout_ms: 500   # perTryTimeout — makes slow responses retriable via reset

# ── RetryGuard controller ─────────────────────────────────────────────────────
topfull_rl:
  enabled: true
retryguard:
  enabled: false               # OFF for the baseline condition
  # Locked parameter set (ADR 0008). Stored for parity with the RetryGuard arm;
  # not used while enabled=false.
  retry_metric: edge_rpr
  sample_interval_seconds: 1
  interval_samples: 20
  rejection_threshold: 0.2
  retries_threshold: 0.4
  climb_rpr_1_to_2: 0.16
  climb_rpr_2_to_3: 0.32
  climb_interval_seconds: 10
  reenable_rejection: 0.25
  burst_rpr: 2.0
  burst_window_seconds: 5
  burst_min_first_attempts: 20

# ── Envoy retry-stats collector (Gap 3 — retries per request) ────────────────
# Scrapes caller-side Envoy outbound counters (frontend + checkoutservice).
# Independent of RetryGuard: enabled in both baseline and RetryGuard arms.
envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  transport: network_prometheus
  # Thread-pool size for parallel HTTP GETs to pod :15020 — NOT extra K8s/GCP worker VMs.
  max_workers: 4

# ── Resource usage collector (Layer 2 — CPU/memory per service) ──────────────
resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

# ── TopFull throttle collector (Layer A cap/admitted + Layer B detector) ────
topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

# ── Output ───────────────────────────────────────────────────────────────────
log_folder: final_s1_tf_only_run3

# ── Infrastructure ───────────────────────────────────────────────────────────
# Matches infra/vm-ips.env. Override here if your setup differs.
infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
