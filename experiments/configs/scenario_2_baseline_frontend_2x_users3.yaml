# ─────────────────────────────────────────────────────────────────────────────
# Scenario 2 — Sustained Overload  |  Probe: frontend 2× + Locust 3× users
#
# Same as scenario_2_baseline_frontend_2x.yaml (frontend cpu_limit_fraction
# 2.0 → 2000m K8s + Detector, TopFull ON, RetryGuard OFF, 600 s) but Locust
# user_counts and spawn_rate scaled ×3. Run after the 1.5× / 2× probe arms
# with a 300 s cool-off between arms.
#
# Locust scripts: uses online_boutique_create_probe.sh (-r $RATE = spawn_rate
# users/sec) so this scale actually reaches target in ~3 s. Shared
# online_boutique_create.sh is UNCHANGED for S1–S6 / teammates.
#
# Independent run_number / log_folder — does NOT overwrite prior frontend-2×
# folders or scenario_2_baseline.yaml slots. Compare against
# baseline_frontend_2x_sustained_overload_run1.
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 2
scenario_name: sustained_overload
condition: baseline
run_number: 1
description: >
  Ramp to ρ > 1, hold 10 minutes. TopFull active, Istio default retries on,
  RetryGuard OFF. Frontend CPU limit+quota at 2× paper (2000m); Locust users
  at 3× deck S2 (spawn 270). Backends stay on paper table.
  Probe launcher: create_probe.sh (-r $RATE).

duration_seconds: 600

locust:
  user_counts:
    getproduct:   300
    postcheckout: 60
    getcart:      300
    postcart:     300
    emptycart:    900
  spawn_rate: 270
  scripts:
    - online_boutique_create_probe.sh
    - online_boutique_create2.sh

scale_constraints:
  - deployment: frontend
    namespace: default
    method: cpu_limit
    cpu_limit_fraction: 2.0   # paper 1000m → 2000m K8s + Detector
    container: server

retries:
  attempts_on: 3
  attempts_off: 0
  per_try_timeout_ms: 500

retryguard:
  enabled: false
  rejection_threshold: 0.20
  sample_interval_seconds: 1
  interval_samples: 30

envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  transport: network_prometheus
  max_workers: 4

resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

log_folder: baseline_frontend_2x_users3_sustained_overload_run1

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
