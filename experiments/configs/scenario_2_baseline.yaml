# ─────────────────────────────────────────────────────────────────────────────
# Scenario 2 — Sustained Overload  |  Condition: BASELINE (no RetryGuard)
#
# The CORE experiment (eval deck slide 12 / SCENARIOS-GUIDE.md). Ramp Locust
# until offered load exceeds cluster capacity (ρ > 1) and HOLD that level
# for 10 minutes. With Istio retries on (default), failed requests are retried
# internally — invisible to TopFull's entry-rate limiter. This creates a
# retry storm: one user request → multiple backend attempts → cluster stays
# saturated even after TopFull cuts the entry rate.
#
# This file is a FLAT 600s hold. It does NOT drop load mid-run. A 2026-08-20
# edit briefly added a recovery phase here so re-enable could fire; that
# diverged from the deck. Forced recovery now lives in Scenario 6. Existing
# matrix runs 1–3 used this same flat shape; run4 is the next repeat (with
# Envoy + resource collectors enabled).
#
# What to look for:
#   - Rejection rates stay elevated despite TopFull throttling
#   - Retries-per-request > 0 (Envoy sidecar metrics)
#   - Goodput plateaus or drops
#   - Under this hold, RetryGuard (when on) typically disables and does NOT
#     re-enable — that is a result, not a config bug (PHASE7-DATA-GAPS.md Gap 1)
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 2
scenario_name: sustained_overload
condition: baseline
run_number: 20
description: >
  Ramp to ρ > 1, hold 10 minutes. TopFull active, Istio default retries on,
  RetryGuard OFF. Captures the retry storm as the unmanaged baseline.

# ── Timing ──────────────────────────────────────────────────────────────────
duration_seconds: 600          # 10 minutes — deck hold, not the S6 recovery profile

# ── Load ────────────────────────────────────────────────────────────────────
# Full load — the default create.sh values already produce overload on our
# 1-worker setup. Increase if rejection rates don't exceed 20% after ~2 min.
locust:
  user_counts:
    getproduct:   100
    postcheckout: 20
    getcart:      100
    postcart:     100
    emptycart:    300
  spawn_rate: 90
  scripts:
    - online_boutique_create.sh
    - online_boutique_create2.sh

# ── Topology constraints ─────────────────────────────────────────────────────
scale_constraints: []          # no manipulation — global overload scenario

# ── Retry policy (Istio VirtualService — applies both arms) ──────────────────
retries:
  attempts_on: 3            # retries.attempts when ON
  attempts_off: 0           # 0 = omit retries block entirely (Istio rejects attempts: 0)
  per_try_timeout_ms: 500   # perTryTimeout — makes slow responses retriable via reset

# ── RetryGuard controller ─────────────────────────────────────────────────────
retryguard:
  enabled: false
  rejection_threshold: 0.20
  sample_interval_seconds: 1
  interval_samples: 30         # paper default (Sec. 6.2), symmetric ON/OFF

# ── Envoy retry-stats collector (Gap 3 — retries per request) ────────────────
envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  transport: network_prometheus
  # Thread-pool size for parallel HTTP GETs to pod :15020 — NOT extra K8s/GCP worker VMs.
  max_workers: 4

# ── Resource usage collector (Layer 2 — CPU/memory per service) ──────────────
resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

# ── TopFull throttle collector (Layer A cap/admitted + Layer B detector) ────
topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

log_folder: baseline_topfull_no_retryguard_sustained_overload_run20

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
