# ─────────────────────────────────────────────────────────────────────────────
# Scenario 3 — Targeted Bottleneck  |  Condition: RETRYGUARD ON
#
# Same constraint and load as baseline. RetryGuard watches checkoutservice's
# rejection rate directly and suppresses retries at that exact node —
# unlike TopFull which can only throttle the full entry API path.
#
# What to look for:
#   - RetryGuard patches checkoutservice VirtualService specifically
#   - Load at checkoutservice drops after patch (retries gone)
#   - Does relief propagate upward? Frontend latency should also improve
#   - Compare vs TopFull-only: which recovers checkoutservice goodput faster?
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 3
scenario_name: targeted_bottleneck
condition: retryguard
run_number: 7
description: >
  Moderate load, checkoutservice CPU-constrained. TopFull + RetryGuard active.
  RetryGuard suppresses retries directly at the bottleneck service.

duration_seconds: 600

locust:
  user_counts:
    getproduct:   100
    postcheckout: 20
    getcart:      100
    postcart:     100
    emptycart:    300
  spawn_rate: 90
  scripts:
    - online_boutique_create.sh
    - online_boutique_create2.sh

scale_constraints:
  - deployment: checkoutservice
    namespace: default
    method: cpu_limit
    cpu_limit: "100m"
    container: server

retryguard:
  enabled: true
  rejection_threshold: 0.20
  window_duration_seconds: 30
  disable_windows: 2
  re_enable_windows: 3
  retry_attempts_on: 3
  retry_attempts_off: 0

# ── Envoy retry-stats collector (Gap 3 — retries per request) ────────────────
# Scrapes caller-side Envoy outbound counters (frontend + checkoutservice).
# Independent of RetryGuard: enabled in both baseline and RetryGuard arms.
envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 5

# ── Resource usage collector (Layer 2 — CPU/memory per service) ──────────────
resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

log_folder: run_topfull_retryguard_targeted_bottleneck_run7

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
