# ─────────────────────────────────────────────────────────────────────────────
# Calibration — checkoutservice, CONSTRAINED CPU (100m), TopFull+RG OFF
#
# Not part of the S1-S6 scenario matrix. Constrains only checkoutservice to
# cpu_limit_fraction 0.1 × paper 1000m → 100m. paymentservice stays paper
# 1000m. Same Locust mix as the full-CPU checkout/payment cal (postcheckout
# 500). TopFull RL and RetryGuard off.
# scenario_id 46 so scenario_dir_name() returns "" (results under campaign_48/).
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 46
scenario_name: calibration_checkout_constrained
condition: calibration
run_number: 1
description: >
  Calibration-only run. checkoutservice CPU constrained to 100m.
  paymentservice stays paper 1000m. TopFull RL off, RetryGuard off.

duration_seconds: 600

locust:
  user_counts:
    getproduct:   50
    postcheckout: 500
    getcart:      50
    postcart:     50
    emptycart:    50
  spawn_rate: 150
  scripts:
    - online_boutique_create.sh
    - online_boutique_create2.sh

scale_constraints:
  - deployment: checkoutservice
    namespace: default
    method: cpu_limit
    cpu_limit_fraction: 0.1    # 0.1 x paper 1000m -> 100m
    container: server

retries:
  attempts_on: 3
  attempts_off: 0
  per_try_timeout_ms: 500

topfull_rl:
  enabled: false

retryguard:
  enabled: false
  rejection_threshold: 0.20
  sample_interval_seconds: 1
  interval_samples: 30

envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  transport: network_prometheus
  max_workers: 4

resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

log_folder: calibration_checkout_constrained_run1

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
