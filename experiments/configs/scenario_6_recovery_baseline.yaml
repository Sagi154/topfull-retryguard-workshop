# ─────────────────────────────────────────────────────────────────────────────
# Scenario 6 — Forced Recovery  |  Condition: BASELINE (no RetryGuard)
#
# NOT Scenario 2. S2 is a 10-minute flat hold at ρ > 1 (deck slide 12).
# This scenario holds the same peak for 5 minutes (long enough to trigger
# RetryGuard disable), then DROPS Locust to ~25% of peak for 10 minutes so
# rejection can fall under 20% and re-enable can fire. Recovery is an input
# to the load generator, not an outcome of the controllers under overload.
#
# Purpose: valid comparison baseline for Scenario 5 (interval tuning) and
# for the S6 RetryGuard arm. Slide 6 requires identical workload between
# arms — S5 must NOT be compared to the flat S2 baseline.
#
# Load profile must stay byte-identical to scenario_6_recovery_retryguard.yaml
# and all four scenario_5_interval_*.yaml configs.
#
# OVERWRITE RISK: run_number / log_folder still name completed campaign run3.
# Bump both to run4 before any extra S6 run, or master overwrites
# baseline_topfull_no_retryguard_forced_recovery_run3.
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 6
scenario_name: forced_recovery
condition: baseline
run_number: 3                  # COMPLETED campaign slot — bump to 4 before re-running
description: >
  Peak overload 0-300s, then drop to ~25% load 300-900s. TopFull active,
  Istio default retries on, RetryGuard OFF. Baseline for Scenario 6 and
  for all Scenario 5 interval runs.

duration_seconds: 900          # 15 minutes: 5 min hold + 10 min recovery window

locust:
  spawn_rate: 90
  phases:
    - at_seconds: 0
      user_counts:
        getproduct:   100
        postcheckout: 20
        getcart:      100
        postcart:     100
        emptycart:    300
    - at_seconds: 300
      user_counts:
        getproduct:   25
        postcheckout: 5
        getcart:      25
        postcart:     25
        emptycart:    75
  scripts:
    - online_boutique_create.sh
    - online_boutique_create2.sh

scale_constraints: []

retryguard:
  enabled: false
  rejection_threshold: 0.20
  window_duration_seconds: 30
  disable_windows: 2
  re_enable_windows: 3
  retry_attempts_on: 3
  retry_attempts_off: 0

envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 5

resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

log_folder: baseline_topfull_no_retryguard_forced_recovery_run3   # completed; next free is _run4

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
