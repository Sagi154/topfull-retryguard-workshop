# ─────────────────────────────────────────────────────────────────────────────
# Scenario 4A — Topology Position: Gateway-Adjacent  |  BASELINE
#
# Constrained service: productcatalogservice
# Position: Gateway-adjacent. Frontend calls ProductCatalog directly
# on many product-browse paths (getproduct). TopFull maps this bottleneck
# most directly to an entry API — it's the easiest signal for TopFull to see.
#
# Comparison point (vs 4B): does RetryGuard add meaningful value on top of
# TopFull when TopFull already has a clean, direct signal to act on?
#
# Constraint: cpu_limit_fraction: 0.1 × paper productcatalog 500m → 50m
# (campaign_48 used absolute 100m — new runs are not comparable to that set).
#
# Call path: Frontend → ProductCatalog  (also via Checkout → ProductCatalog)
# Primary affected API: getproduct
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 4
scenario_name: topology_position_A
condition: baseline
run_number: 7
description: >
  productcatalogservice constrained (gateway-adjacent position).
  TopFull active, RetryGuard OFF. TopFull has a direct entry-API signal.

duration_seconds: 600

locust:
  user_counts:
    getproduct:   100
    postcheckout: 20
    getcart:      100
    postcart:     100
    emptycart:    300
  spawn_rate: 90
  scripts:
    - online_boutique_create.sh
    - online_boutique_create2.sh

scale_constraints:
  - deployment: productcatalogservice
    namespace: default
    method: cpu_limit
    cpu_limit_fraction: 0.1    # 0.1 × paper 500m → 50m (not comparable to campaign_48 100m)
    container: server

retryguard:
  enabled: false
  rejection_threshold: 0.20
  sample_interval_seconds: 1
  interval_samples: 30         # paper default (Sec. 6.2), symmetric ON/OFF
  retry_attempts_on: 3
  retry_attempts_off: 0

# ── Envoy retry-stats collector (Gap 3 — retries per request) ────────────────
# Scrapes caller-side Envoy outbound counters (frontend + checkoutservice).
# Independent of RetryGuard: enabled in both baseline and RetryGuard arms.
envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  exec_mode: docker_local
  # Thread-pool size for parallel docker exec scrapes on worker_ssh_host — NOT extra K8s/GCP worker VMs.
  max_workers: 4

# ── Resource usage collector (Layer 2 — CPU/memory per service) ──────────────
resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

# ── TopFull throttle collector (Layer A cap/admitted + Layer B detector) ────
topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

log_folder: baseline_topfull_no_retryguard_topology_position_A_run7

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  worker_ssh_host: topfull-worker-1
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
