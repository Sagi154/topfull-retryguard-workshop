# ─────────────────────────────────────────────────────────────────────────────
# Scenario 3 — Targeted Bottleneck  |  Condition: BASELINE (no RetryGuard)
#
# A specific service (checkoutservice) is constrained BEFORE load starts.
# Overall offered load is moderate — only the constrained service hits ρ > 1.
# This isolates the retry storm to a known node in the call chain:
#   Frontend → Checkout → Cart, Shipping, Currency, ProductCatalog, Email, Payment
#
# Constraint method: cpu_limit with cpu_limit_millicores: 50 (ADR-0006).
#   Absolute 50m K8s limit AND TopFull Detector quota for this run — the
#   one CPU point checkoutservice has trustworthy mu_sat saturation data
#   for. Runner reconciles both back to paper after the run.
#
# Alternative (if you have >1 replica): change method to "replicas" and set
#   replicas: 1  (runner auto-detects and restores original count).
#
# What to look for:
#   - Rejection rate spikes specifically at postcheckout endpoint
#   - TopFull throttles postcheckout entry API (blunt/indirect response)
#   - Retry storm amplifies load at checkoutservice specifically
#   - Upstream callers (frontend) also show latency increase
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 3
scenario_name: targeted_bottleneck
condition: baseline
run_number: 10
description: >
  Moderate full-chain load with checkoutservice CPU-constrained.
  TopFull active, RetryGuard OFF. Captures per-service retry amplification
  at a known bottleneck.

duration_seconds: 600

locust:
  user_counts:
    getproduct:   100
    postcheckout: 20
    getcart:      100
    postcart:     100
    emptycart:    300
  spawn_rate: 90
  scripts:
    - online_boutique_create_v2.sh

# ── Topology constraint ───────────────────────────────────────────────────────
scale_constraints:
  - deployment: checkoutservice
    namespace: default
    method: cpu_limit
    cpu_limit_millicores: 50   # absolute cap (ADR-0006) — the one CPU point
                                # checkoutservice has trustworthy mu_sat data
                                # for (experiments/capacity/capacity_frozen.json)
    container: server          # container name inside the checkoutservice pod

  # Alternative: if checkoutservice currently has >1 replica, use:
  # - deployment: checkoutservice
  #   namespace: default
  #   method: replicas
  #   replicas: 1              # runner auto-detects original and restores it

# ── Retry policy (Istio VirtualService — applies both arms) ──────────────────
retries:
  attempts_on: 3            # retries.attempts when ON
  attempts_off: 0           # 0 = omit retries block entirely (Istio rejects attempts: 0)
  per_try_timeout_ms: 500   # perTryTimeout — makes slow responses retriable via reset

retryguard:
  enabled: false
  rejection_threshold: 0.20
  sample_interval_seconds: 1
  interval_samples: 30         # paper default (Sec. 6.2), symmetric ON/OFF

# ── Envoy retry-stats collector (Gap 3 — retries per request) ────────────────
# Scrapes caller-side Envoy outbound counters (frontend + checkoutservice).
# Independent of RetryGuard: enabled in both baseline and RetryGuard arms.
envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  transport: network_prometheus
  # Thread-pool size for parallel HTTP GETs to pod :15020 — NOT extra K8s/GCP worker VMs.
  max_workers: 4

# ── Resource usage collector (Layer 2 — CPU/memory per service) ──────────────
resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

# ── TopFull throttle collector (Layer A cap/admitted + Layer B detector) ────
topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

log_folder: baseline_topfull_no_retryguard_targeted_bottleneck_run10

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
