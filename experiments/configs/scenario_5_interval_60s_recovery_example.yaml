# ─────────────────────────────────────────────────────────────────────────────
# Scenario 5 — Re-enable Interval Tuning  |  Interval: 60s | RECOVERY-PHASE EXAMPLE
#
# NOT part of the official 38-run Phase 5/6 matrix (see PHASE5-PHASE6-RUNLIST.md).
# Illustrates the locust.phases fix for Gap 1 in PHASE7-DATA-GAPS.md: holds
# the original scenario_5_interval_60s.yaml overload level for 300s (long
# enough to trigger RetryGuard's disable, per the matrix data), then drops
# to ~25% of peak load so rejection can fall under the 20% threshold and
# actually exercise re_enable_windows. Has NOT been run yet — implementation
# + parameters only, per the plan in
# docs (see CreatePlan output "Recovery-Phase Load Support").
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 5
scenario_name: interval_tuning_recovery_example
condition: retryguard
run_number: 1
description: >
  Sustained overload (0-300s) to trigger disable, then load dropped to ~25%
  of peak (300-900s) so rejection can fall under threshold and re-enable can
  fire. Re-enable interval = 60s (conservative), matching the interval_60s
  config it is derived from.

duration_seconds: 900

locust:
  spawn_rate: 90
  phases:
    - at_seconds: 0
      user_counts:
        getproduct:   100
        postcheckout: 20
        getcart:      100
        postcart:     100
        emptycart:    300
    - at_seconds: 300
      user_counts:
        getproduct:   25
        postcheckout: 5
        getcart:      25
        postcart:     25
        emptycart:    75
  scripts:
    - online_boutique_create.sh
    - online_boutique_create2.sh

scale_constraints: []

retryguard:
  enabled: true
  rejection_threshold: 0.20
  window_duration_seconds: 30
  disable_windows: 2
  re_enable_windows: 6         # 6 windows x 30s = 180s effective (conservative)
  retry_attempts_on: 3
  retry_attempts_off: 0

log_folder: run_topfull_retryguard_interval_60s_recovery_example_run1

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
