# ─────────────────────────────────────────────────────────────────────────────
# Scenario 5 — Interval Tuning  |  Interval: 60s (conservative)
# interval_samples: 60  →  60 consecutive 1s samples = 60s, symmetric ON/OFF
#
# Same load as Scenario 6 (forced recovery), NOT Scenario 2.
# Only interval_samples changes across the four S5 configs — applied
# symmetrically to both disable and re-enable. sample_interval_seconds is 1.
# Load must stay byte-identical to scenario_6_recovery_{baseline,retryguard}.yaml
# and the other three scenario_5_interval_*.yaml files. Compare against S6
# baseline, not S2. Slowest interval (60s, both directions) — 600s of post-drop
# runway leaves room for multiple intervals, the most conservative of the four.
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 5
scenario_name: interval_tuning
condition: retryguard
run_number: 6
description: >
  Sustained overload 0-300s, then dropped to ~25% load 300-900s so recovery
  can occur. RetryGuard on, interval = 60s (conservative), symmetric ON/OFF.
  Risk: stays retry-free too long after recovery; goodput may be artificially
  suppressed. Tests whether TopFull + RetryGuard reach a stable equilibrium
  even with a long interval.

duration_seconds: 900

locust:
  spawn_rate: 90
  phases:
    - at_seconds: 0
      user_counts:
        getproduct:   100
        postcheckout: 20
        getcart:      100
        postcart:     100
        emptycart:    300
    - at_seconds: 300
      user_counts:
        getproduct:   25
        postcheckout: 5
        getcart:      25
        postcart:     25
        emptycart:    75
  scripts:
    - online_boutique_create.sh
    - online_boutique_create2.sh

scale_constraints: []

retryguard:
  enabled: true
  rejection_threshold: 0.20
  sample_interval_seconds: 1
  interval_samples: 60         # ← THE VARIABLE: 60 consecutive 1s samples = 60s, symmetric ON/OFF
  retry_attempts_on: 3
  retry_attempts_off: 0

# ── Envoy retry-stats collector (Gap 3 — retries per request) ────────────────
# Scrapes caller-side Envoy outbound counters (frontend + checkoutservice).
# Independent of RetryGuard: enabled in both baseline and RetryGuard arms.
envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1

# ── Resource usage collector (Layer 2 — CPU/memory per service) ──────────────
resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

# ── TopFull throttle collector (Layer A cap/admitted + Layer B detector) ────
topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

log_folder: run_topfull_retryguard_interval_60s_run6

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
