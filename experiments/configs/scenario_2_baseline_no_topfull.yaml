# ─────────────────────────────────────────────────────────────────────────────
# Scenario 2 — Sustained Overload  |  Both controllers OFF (proxy only)
#
# run14–run17 are the 2026-09-25 four-mix sweep. run18–run21 are the
# 2026-09-25 CPU-dispense replay of source mixes 6, 10, 11, 12
# (frontend pinned at 4). This file's current slot is the next hold.
#
# Independent run_number / log_folder — does NOT consume slots from
# scenario_2_baseline.yaml (baseline_topfull_no_retryguard_sustained_overload_*).
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 2
scenario_name: sustained_overload
condition: baseline
run_number: 22                  # run18–run21 are the CPU-dispense replay; next free
description: >
  Both controllers off. Frontend pinned at 4, catalog HPA max 1, sidecar
  request 90m. CPU dispense: cart 1200, ad 800, checkout 1500, email 155,
  redis-cart 540, shipping 770, recommendations 1250, frontend 1150,
  currency 770, payments 155, productcatalog 1535. Slot run22 is unused.
  run18–run21 replayed source mixes 6, 10, 11, and 12. Proxy ON,
  deploy_rl.py skipped, RetryGuard OFF, Istio default retries.

duration_seconds: 600

locust:
  user_counts:
    getproduct:   100
    postcheckout: 150
    getcart:      100
    postcart:     100
    emptycart:    5
  spawn_rate: 50
  scripts:
    - online_boutique_create_v2.sh

# Only the four services that differ from the paper table. The runner
# reconciles every service to paper first, then applies these overrides.
# Order frees cart/ad budget before raising checkout and recommendations.
scale_constraints:
  - deployment: cartservice
    namespace: default
    method: cpu_limit
    cpu_limit_millicores: 1200
    container: server
  - deployment: adservice
    namespace: default
    method: cpu_limit
    cpu_limit_millicores: 800
    container: server
  - deployment: checkoutservice
    namespace: default
    method: cpu_limit
    cpu_limit_millicores: 1500
    container: server
  - deployment: recommendationservice
    namespace: default
    method: cpu_limit
    cpu_limit_millicores: 1250
    container: server

retries:
  attempts_on: 3
  attempts_off: 0
  per_try_timeout_ms: 500

# Go proxy stays up; deploy_rl.py is skipped — no admission throttling.
topfull_rl:
  enabled: false

retryguard:
  enabled: false
  rejection_threshold: 0.20
  sample_interval_seconds: 1
  interval_samples: 30

envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  transport: network_prometheus
  max_workers: 4

resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

log_folder: baseline_no_topfull_sustained_overload_run22

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
