# ─────────────────────────────────────────────────────────────────────────────
# Scenario 2 — Sustained Overload  |  Both controllers OFF (proxy only)
#
# run26–run29 replay both-off mixes 14–17 with the sidecar CPU limit unset.
# run14–run17 stay untouched (those holds used proxyCPULimit=90m).
#
# Independent run_number / log_folder — does NOT consume slots from
# scenario_2_baseline.yaml (baseline_topfull_no_retryguard_sustained_overload_*).
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 2
scenario_name: sustained_overload
condition: baseline
run_number: 30                  # run29 pulled; slot unused
description: >
  Both controllers off. Paper CPU table. Slot run30 is unused.
  run26–run29 replayed mixes 14–17 (325/100/100/100/5, 325/100/100/20/5,
  50/100/100/400/5, 50/50/50/50/430) with proxyCPULimit unset. The counts
  below are the mix-17 values left after run29. Proxy ON, deploy_rl.py
  skipped, RetryGuard OFF, Istio default retries.

duration_seconds: 600

locust:
  user_counts:
    getproduct:   50
    postcheckout: 50
    getcart:      50
    postcart:     50
    emptycart:    430
  spawn_rate: 50
  scripts:
    - online_boutique_create_v2.sh

# Paper CPU table only. The runner reconciles every service to paper
# limits before the hold and again after it.
scale_constraints: []

retries:
  attempts_on: 3
  attempts_off: 0
  per_try_timeout_ms: 500

# Go proxy stays up; deploy_rl.py is skipped — no admission throttling.
topfull_rl:
  enabled: false

retryguard:
  enabled: false
  rejection_threshold: 0.20
  sample_interval_seconds: 1
  interval_samples: 30

envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  transport: network_prometheus
  max_workers: 4

resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

log_folder: baseline_no_topfull_sustained_overload_run30

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
