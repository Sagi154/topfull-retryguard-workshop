# ─────────────────────────────────────────────────────────────────────────────
# Scenario 2 — Sustained Overload  |  Control: TopFull RL OFF (proxy only)
#
# Deliberate TopFull-off A/B against baseline_topfull_no_retryguard_sustained_
# overload_run21 (e2-standard-16, TopFull RL ON). Same Locust load, same
# perTryTimeout 500ms, same collectors — only difference is deploy_rl.py is
# NOT started. Proxy stays up (Locust must route through :8090); admission
# caps stay at the 10000 sentinel. Purpose: isolate whether TopFull's
# throttling is what suppressed Envoy outbound retries on run21.
#
# Independent run_number / log_folder — does NOT consume slots from
# scenario_2_baseline.yaml (baseline_topfull_no_retryguard_sustained_overload_*).
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 2
scenario_name: sustained_overload
condition: baseline
run_number: 2                  # run1 completed 2026-09-15 — bumped to avoid overwrite
description: >
  Ramp to ρ > 1, hold 10 minutes. Go proxy ON, TopFull RL OFF (no admission
  control), Istio default retries on, RetryGuard OFF. Control run to test
  whether TopFull throttling suppresses Envoy retries.

duration_seconds: 600

locust:
  user_counts:
    getproduct:   100
    postcheckout: 20
    getcart:      100
    postcart:     100
    emptycart:    300
  spawn_rate: 90
  scripts:
    - online_boutique_create.sh
    - online_boutique_create2.sh

scale_constraints: []

retries:
  attempts_on: 3
  attempts_off: 0
  per_try_timeout_ms: 500

# Go proxy stays up; deploy_rl.py is skipped — no admission throttling.
topfull_rl:
  enabled: false

retryguard:
  enabled: false
  rejection_threshold: 0.20
  sample_interval_seconds: 1
  interval_samples: 30

envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  transport: network_prometheus
  max_workers: 4

resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

log_folder: baseline_no_topfull_sustained_overload_run2

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
