# Both-off S2. Paper-C3 (run81): paper CPU except checkout 800, catalog 800,
# cart 800, email 120, and payment 120. paper_cpu_reconcile is false so launch keeps those overrides.

scenario_id: 2
scenario_name: sustained_overload
condition: baseline
run_number: 81
description: >
  Both controllers off. Paper-C3: paper CPU except checkout 800, catalog 800,
  cart 800, email 120, and payment 120. Frontend pinned at 4. Mix 250/100/100/100/5.

duration_seconds: 600

locust:
  user_counts:
    getproduct:   250
    postcheckout: 100
    getcart:      100
    postcart:     100
    emptycart:    5
  spawn_rate: 50
  scripts:
    - online_boutique_create_v2.sh

scale_constraints:
  - {deployment: checkoutservice,       namespace: default, container: server, method: cpu_limit, cpu_limit_millicores: 800}
  - {deployment: productcatalogservice, namespace: default, container: server, method: cpu_limit, cpu_limit_millicores: 800}
  - {deployment: cartservice,           namespace: default, container: server, method: cpu_limit, cpu_limit_millicores: 800}
  - {deployment: emailservice,          namespace: default, container: server, method: cpu_limit, cpu_limit_millicores: 120}
  - {deployment: paymentservice,        namespace: default, container: server, method: cpu_limit, cpu_limit_millicores: 120}

paper_cpu_reconcile: false

retries:
  attempts_on: 3
  attempts_off: 0
  per_try_timeout_ms: 500

topfull_rl:
  enabled: false

retryguard:
  enabled: false
  rejection_threshold: 0.20
  sample_interval_seconds: 1
  interval_samples: 30

envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  transport: network_prometheus
  max_workers: 4

resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

log_folder: baseline_no_topfull_sustained_overload_run81

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
