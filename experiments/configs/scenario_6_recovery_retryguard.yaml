# ─────────────────────────────────────────────────────────────────────────────
# Scenario 6 — Forced Recovery  |  Condition: RETRYGUARD ON
#
# Identical load to scenario_6_recovery_baseline.yaml. Paper-default
# re_enable_windows: 3 (90s effective). Same experiment as
# scenario_5_interval_30s.yaml (keep both: this is the canonical S6 pair;
# S5-30s is the default point on the interval sweep).
#
# Load profile must stay byte-identical to scenario_6_recovery_baseline.yaml
# and all four scenario_5_interval_*.yaml configs. Only retryguard.enabled
# / condition / log_folder differ vs the S6 baseline.
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 6
scenario_name: forced_recovery
condition: retryguard
run_number: 1
description: >
  Peak overload 0-300s, then drop to ~25% load 300-900s. TopFull + RetryGuard
  both active, re-enable interval = paper default (3 windows × 30s = 90s).
  Load drop gives disable -> recover -> re-enable room to complete.

duration_seconds: 900

locust:
  spawn_rate: 90
  phases:
    - at_seconds: 0
      user_counts:
        getproduct:   100
        postcheckout: 20
        getcart:      100
        postcart:     100
        emptycart:    300
    - at_seconds: 300
      user_counts:
        getproduct:   25
        postcheckout: 5
        getcart:      25
        postcart:     25
        emptycart:    75
  scripts:
    - online_boutique_create.sh
    - online_boutique_create2.sh

scale_constraints: []

retryguard:
  enabled: true
  rejection_threshold: 0.20
  window_duration_seconds: 30
  disable_windows: 2
  re_enable_windows: 3         # paper default — same as scenario_5_interval_30s.yaml
  retry_attempts_on: 3
  retry_attempts_off: 0

envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 5

resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

log_folder: run_topfull_retryguard_forced_recovery_run1

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
