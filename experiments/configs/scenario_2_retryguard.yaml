# ─────────────────────────────────────────────────────────────────────────────
# Scenario 2 — Sustained Overload  |  Condition: RETRYGUARD ON
#
# Identical FLAT 600s load to scenario_2_baseline.yaml. RetryGuard watches
# per-service rejection rates. After ~20% rejection persists across 2
# consecutive 30-second windows, it patches the Istio VirtualService:
# retries.attempts → 0. The deck (slide 12) expects disable → recover →
# re-enable under CONTINUED overload. Matrix runs 1–3 showed disable fires
# and re-enable does not (rejection stays ~75–100%). That is Scenario 2's
# result. To elicit OFF→ON by dropping offered load, use Scenario 6 / S5.
#
# What to look for:
#   - RetryGuard log: VirtualService patches with timestamps
#   - Retries-per-request drops after each disable
#   - Goodput vs the flat S2 baseline
#   - Whether TopFull RL admits more traffic after suppression
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 2
scenario_name: sustained_overload
condition: retryguard
run_number: 7
description: >
  Ramp to ρ > 1, hold 10 minutes. TopFull + RetryGuard both active.
  RetryGuard suppresses retries per service when rejection > 20%.

duration_seconds: 600

locust:
  user_counts:
    getproduct:   100
    postcheckout: 20
    getcart:      100
    postcart:     100
    emptycart:    300
  spawn_rate: 90
  scripts:
    - online_boutique_create.sh
    - online_boutique_create2.sh

scale_constraints: []

retryguard:
  enabled: true
  rejection_threshold: 0.20
  window_duration_seconds: 30
  disable_windows: 2           # 2 windows × 30s = 60s above threshold → disable
  re_enable_windows: 3         # 3 windows × 30s = 90s below threshold → re-enable
  retry_attempts_on: 3
  retry_attempts_off: 0

# ── Envoy retry-stats collector (Gap 3 — retries per request) ────────────────
envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 5

# ── Resource usage collector (Layer 2 — CPU/memory per service) ──────────────
resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

log_folder: run_topfull_retryguard_sustained_overload_run7

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
