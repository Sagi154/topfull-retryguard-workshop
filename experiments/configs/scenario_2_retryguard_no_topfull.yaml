# Scenario 2 | RetryGuard ON, TopFull RL OFF
# Edge-rpr series, run 89 mix 275/90/100/90/5. Slots run13–run14 are the
# 2026-10-07 attempt-ramp holds. run15 is the OFF-route timeout hold.
# run16 and run17 record grpc_5xx without changing retryOn or the
# rejection formula. Next free slot after those two is run18.

scenario_id: 2
scenario_name: sustained_overload
condition: retryguard
run_number: 18
description: >
  Unused next slot after the 2026-10-07 grpc_5xx observation holds
  (run16, run17). Those left retryOn and the rejection formula unchanged.
  Run 89 mix 275/90/100/90/5. Checkout and recommendations rolled before
  the hold.
duration_seconds: 600
locust:
  user_counts:
    getproduct: 275
    postcheckout: 90
    getcart: 100
    postcart: 90
    emptycart: 5
  spawn_rate: 50
  scripts:
  - online_boutique_create_v2.sh
paper_cpu_reconcile: false
restart_before_hold:
  deployments:
  - checkoutservice
  - recommendationservice
  settle_seconds: 60
scale_constraints:
- deployment: checkoutservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 800
- deployment: recommendationservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 1150
- deployment: productcatalogservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 800
- deployment: cartservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 800
- deployment: currencyservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 770
- deployment: shippingservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 770
- deployment: adservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 1150
- deployment: paymentservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 155
- deployment: emailservice
  namespace: default
  container: server
  method: cpu_limit
  cpu_limit_millicores: 120
- deployment: redis-cart
  namespace: default
  container: redis
  method: cpu_limit
  cpu_limit_millicores: 540
retries:
  attempts_on: 3
  attempts_off: 0
  per_try_timeout_ms: 500
topfull_rl:
  enabled: false
retryguard:
  enabled: true
  rejection_threshold: 0.2
  sample_interval_seconds: 1
  interval_samples: 30
  retry_metric: edge_rpr
  retries_threshold: 0.5
envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  transport: network_prometheus
  max_workers: 4
resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5
topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1
log_folder: run_retryguard_no_topfull_sustained_overload_run18
infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
