# ─────────────────────────────────────────────────────────────────────────────
# Scenario 1 — Normal Operation  |  Condition: RETRYGUARD ON
#
# Identical to the baseline run. RetryGuard is active but must make
# zero VirtualService patches because rejection rates never exceed 20%.
# If it does patch anything → threshold is miscalibrated.
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 1
scenario_name: normal_operation
condition: retryguard
run_number: 1
description: >
  Flat RPS well within cluster capacity. TopFull + RetryGuard both active.
  RetryGuard must remain completely silent (zero VirtualService patches).

duration_seconds: 300

locust:
  user_counts:
    getproduct:   50
    postcheckout: 10
    getcart:      50
    postcart:     50
    emptycart:    150
  spawn_rate: 45
  scripts:
    - online_boutique_create.sh
    - online_boutique_create2.sh

scale_constraints: []

retryguard:
  enabled: true
  rejection_threshold: 0.20
  window_duration_seconds: 30
  disable_windows: 2
  re_enable_windows: 3
  retry_attempts_on: 3
  retry_attempts_off: 0

log_folder: run_topfull_retryguard_normal_op_run1

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
