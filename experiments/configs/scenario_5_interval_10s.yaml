# ─────────────────────────────────────────────────────────────────────────────
# Scenario 5 — Interval Tuning  |  Interval: 10s (aggressive)
#
# Same load as Scenario 6 (forced recovery), NOT Scenario 2. RetryGuard ALWAYS ON.
# Only interval_samples changes across the four S5 configs — applied
# symmetrically to both the disable and re-enable transitions (paper
# Algorithm 1 uses one Interval for both, not separate disable/re-enable
# values). sample_interval_seconds is fixed at 1 across all four.
#
# interval_samples: 10  →  10 consecutive 1s samples = 10s, both directions.
#
# Risk: re-enables (and disables) too fast. Retries restart before bottleneck
# is truly clear. Likely outcome: oscillation — disable/re-enable cycles
# repeat rapidly. Watch for: number of toggle events per run (too many =
# instability).
#
# Gap 1: flat S2 never produced OFF→ON. This file uses Scenario 6's 900s
# load-drop profile so re-enable can fire. Load must stay byte-identical to
# scenario_6_recovery_{baseline,retryguard}.yaml and the other three
# scenario_5_interval_*.yaml files — only interval_samples differs across
# the four S5 files. Compare against S6 baseline, not S2.
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 5
scenario_name: interval_tuning
condition: retryguard
run_number: 6
description: >
  Sustained overload 0-300s, then dropped to ~25% load 300-900s so recovery
  can occur. RetryGuard on, interval = 10s (aggressive), symmetric ON/OFF.
  Risk of oscillation: retries re-enabled before bottleneck clears.

duration_seconds: 900

locust:
  spawn_rate: 90
  phases:
    - at_seconds: 0
      user_counts:
        getproduct:   100
        postcheckout: 20
        getcart:      100
        postcart:     100
        emptycart:    300
    - at_seconds: 300
      user_counts:
        getproduct:   25
        postcheckout: 5
        getcart:      25
        postcart:     25
        emptycart:    75
  scripts:
    - online_boutique_create_v2.sh

scale_constraints: []

# ── Retry policy (Istio VirtualService — applies both arms) ──────────────────
retries:
  attempts_on: 3            # retries.attempts when ON
  attempts_off: 0           # 0 = omit retries block entirely (Istio rejects attempts: 0)
  per_try_timeout_ms: 500   # perTryTimeout — makes slow responses retriable via reset

retryguard:
  enabled: true
  rejection_threshold: 0.20
  sample_interval_seconds: 1
  interval_samples: 10         # ← THE VARIABLE: 10 consecutive 1s samples = 10s, symmetric ON/OFF

# ── Envoy retry-stats collector (Gap 3 — retries per request) ────────────────
# Scrapes caller-side Envoy outbound counters (frontend + checkoutservice).
# Independent of RetryGuard: enabled in both baseline and RetryGuard arms.
envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 1
  transport: network_prometheus
  # Thread-pool size for parallel HTTP GETs to pod :15020 — NOT extra K8s/GCP worker VMs.
  max_workers: 4

# ── Resource usage collector (Layer 2 — CPU/memory per service) ──────────────
resource_usage_collector:
  enabled: true
  poll_interval_seconds: 5

# ── TopFull throttle collector (Layer A cap/admitted + Layer B detector) ────
topfull_throttle_collector:
  enabled: true
  poll_interval_seconds: 1

log_folder: run_topfull_retryguard_interval_10s_run6

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
  resource_usage_collector_script: /home/idozacharia/experiments/resource_usage_collector.py
  topfull_throttle_collector_script: /home/idozacharia/experiments/topfull_throttle_collector.py
