# ─────────────────────────────────────────────────────────────────────────────
# Scenario 5 — Re-enable Interval Tuning  |  Interval: 10s (aggressive)
#
# Sustained overload (same as Scenario 2). RetryGuard ALWAYS ON.
# Only the re_enable_windows parameter changes across the four S5 configs.
#
# re_enable_windows: 1  →  1 × 30s = 30s effective wait
# (RetryGuard re-enables retries after just 1 window below threshold.
#  Folder label "10s" is historical; see PHASE5-EXPERIMENTS-GUIDE.md §2 table.)
#
# Risk: re-enables too fast. Retries restart before bottleneck is truly clear.
# Likely outcome: oscillation — disable/re-enable cycles repeat rapidly.
# Watch for: number of toggle events per run (too many = instability).
#
# Recovery phase (added for Gap 1, see PHASE7-DATA-GAPS.md): the original
# flat 600s overload triggered disables but rejection never fell back under
# threshold, so re_enable_windows was never exercised (zero OFF->ON events).
# Duration extended 600s -> 900s and a load-drop phase added at t=300s.
# Load profile must stay byte-identical to scenario_2_baseline.yaml,
# scenario_2_retryguard.yaml, and the other three scenario_5_interval_*.yaml
# configs — only re_enable_windows differs across the four S5 files.
# ─────────────────────────────────────────────────────────────────────────────

scenario_id: 5
scenario_name: interval_tuning
condition: retryguard
run_number: 3
description: >
  Sustained overload 0-300s, then dropped to ~25% load 300-900s so recovery
  can occur. RetryGuard on, re-enable interval = 10s (aggressive).
  Risk of oscillation: retries re-enabled before bottleneck clears.

duration_seconds: 900

locust:
  spawn_rate: 90
  phases:
    - at_seconds: 0
      user_counts:
        getproduct:   100
        postcheckout: 20
        getcart:      100
        postcart:     100
        emptycart:    300
    - at_seconds: 300
      user_counts:
        getproduct:   25
        postcheckout: 5
        getcart:      25
        postcart:     25
        emptycart:    75
  scripts:
    - online_boutique_create.sh
    - online_boutique_create2.sh

scale_constraints: []

retryguard:
  enabled: true
  rejection_threshold: 0.20
  window_duration_seconds: 30
  disable_windows: 2
  re_enable_windows: 1         # ← THE VARIABLE: 1 window × 30s = 30s effective
  retry_attempts_on: 3
  retry_attempts_off: 0

# ── Envoy retry-stats collector (Gap 3 — retries per request) ────────────────
# Scrapes caller-side Envoy outbound counters (frontend + checkoutservice).
# Independent of RetryGuard: enabled in both baseline and RetryGuard arms.
envoy_retry_collector:
  enabled: true
  poll_interval_seconds: 5

log_folder: run_topfull_retryguard_interval_10s_run3

infra:
  master_ssh_host: topfull-master
  loadgen_ssh_host: topfull-load
  topfull_src_path: /home/idozacharia/TopFull/TopFull_master/online_boutique_scripts/src
  topfull_loadgen_path: /home/idozacharia/TopFull/TopFull_loadgen
  venv_activate: /home/idozacharia/TopFull/venv/bin/activate
  results_base_path: /home/idozacharia/experiments/results
  retryguard_script: /home/idozacharia/experiments/retryguard.py
  envoy_retry_collector_script: /home/idozacharia/experiments/envoy_retry_collector.py
