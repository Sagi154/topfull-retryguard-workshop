# Istio VirtualServices for Online Boutique — default retry policy (attempts: 3).
# RetryGuard patches retries.attempts at runtime (see experiments/retryguard.py).
# Apply: kubectl apply -f experiments/virtual-services.yaml
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: adservice
  namespace: default
spec:
  hosts:
    - adservice
  http:
    - retries:
        attempts: 3
        retryOn: "5xx,reset,connect-failure"
      route:
        - destination:
            host: adservice
